# Chainsaw Configuration
# Global settings for all functional tests
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Configuration
metadata:
  name: idp-functional-tests
spec:
  # Test execution settings
  timeouts:
    apply: 30s
    assert: 2m
    cleanup: 2m
    delete: 2m
    error: 30s
    exec: 2m

  # Parallel execution (reduced to avoid API timeouts on minikube)
  parallel: 2

  # Skip cleanup on failure for debugging
  skipDelete: false

  # Fail fast - stop on first failure
  failFast: false

  # Catch failures for all tests
  catch:
    - events:
        namespace: '*'
    - podLogs:
        namespace: argocd
        selector: app.kubernetes.io/name=argocd-server
        tail: 50
