# Chainsaw Test: Gateway Controller
# Verifies Envoy Gateway controller is running (Gateway API)
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: gateway-controller
spec:
  description: Verify Envoy Gateway controller is healthy
  steps:
    - name: check-envoy-gateway-deployment
      description: Envoy Gateway deployment must be available
      try:
        - assert:
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: envoy-gateway
                namespace: envoy-gateway-system
              status:
                (conditions[?type == 'Available']):
                  - status: "True"

    - name: check-gatewayclass
      description: GatewayClass 'eg' must be accepted
      try:
        - assert:
            resource:
              apiVersion: gateway.networking.k8s.io/v1
              kind: GatewayClass
              metadata:
                name: eg
              status:
                (conditions[?type == 'Accepted']):
                  - status: "True"

    - name: check-platform-gateway
      description: Platform Gateway must exist in envoy-gateway-system
      try:
        - assert:
            resource:
              apiVersion: gateway.networking.k8s.io/v1
              kind: Gateway
              metadata:
                name: platform-gateway
                namespace: envoy-gateway-system
