# Chainsaw Test: Gateway API Validation
# Environment-independent tests for Gateway API migration
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: gateway-api
spec:
  description: Comprehensive Gateway API migration validation tests
  timeouts:
    apply: 60s
    assert: 120s
    cleanup: 60s
  steps:
    # ==========================================================================
    # Static Validation Tests (no cluster resources required)
    # ==========================================================================
    - name: validate-envoy-gateway-kustomize
      description: Envoy Gateway manifests must build without errors
      try:
        - script:
            timeout: 60s
            content: |
              #!/bin/bash
              set -e
              REPO_ROOT=$(git rev-parse --show-toplevel 2>/dev/null || echo "${CHAINSAW_REPO_ROOT:-/workspaces/x-change-platform-engineering-demo}")
              cd "$REPO_ROOT"
              OUTPUT=$(kustomize build gitops/manifests/platform/envoy-gateway 2>&1)
              if ! echo "$OUTPUT" | grep -q "kind: Gateway"; then
                echo "FAIL: Gateway resource not found in kustomize output"
                exit 1
              fi
              echo "PASS: Envoy Gateway kustomize build validated"

    - name: validate-argo-rollouts-gateway-api
      description: Argo Rollouts Gateway API plugin resources must exist
      try:
        - script:
            timeout: 60s
            content: |
              #!/bin/bash
              set -e
              REPO_ROOT=$(git rev-parse --show-toplevel 2>/dev/null || echo "${CHAINSAW_REPO_ROOT:-/workspaces/x-change-platform-engineering-demo}")
              cd "$REPO_ROOT"
              OUTPUT=$(kustomize build gitops/manifests/platform/argo-rollouts 2>&1)
              if ! echo "$OUTPUT" | grep -q "argo-rollouts-gateway-api"; then
                echo "FAIL: Gateway API RBAC not found"
                exit 1
              fi
              if ! echo "$OUTPUT" | grep -q "argoproj-labs/gatewayAPI"; then
                echo "FAIL: Gateway API plugin config not found"
                exit 1
              fi
              echo "PASS: Argo Rollouts Gateway API config validated"

    - name: validate-httproute-template
      description: HTTPRoute template must have valid structure
      try:
        - script:
            timeout: 30s
            content: |
              #!/bin/bash
              set -e
              REPO_ROOT=$(git rev-parse --show-toplevel 2>/dev/null || echo "${CHAINSAW_REPO_ROOT:-/workspaces/x-change-platform-engineering-demo}")
              cd "$REPO_ROOT"
              TEMPLATE="apptemplates/simplenodeservice-content/httproute.yml"
              if [ ! -f "$TEMPLATE" ]; then
                echo "FAIL: HTTPRoute template not found: $TEMPLATE"
                exit 1
              fi
              if ! grep -q "gateway.networking.k8s.io/v1" "$TEMPLATE"; then
                echo "FAIL: HTTPRoute must use gateway.networking.k8s.io/v1"
                exit 1
              fi
              if ! grep -q "platform-gateway" "$TEMPLATE"; then
                echo "FAIL: HTTPRoute must reference platform-gateway"
                exit 1
              fi
              if ! grep -q "stable" "$TEMPLATE" || ! grep -q "canary" "$TEMPLATE"; then
                echo "FAIL: HTTPRoute must have stable and canary backendRefs"
                exit 1
              fi
              echo "PASS: HTTPRoute template validated"

    - name: validate-rollout-template
      description: Rollout template must have Gateway API traffic routing
      try:
        - script:
            timeout: 30s
            content: |
              #!/bin/bash
              set -e
              REPO_ROOT=$(git rev-parse --show-toplevel 2>/dev/null || echo "${CHAINSAW_REPO_ROOT:-/workspaces/x-change-platform-engineering-demo}")
              cd "$REPO_ROOT"
              TEMPLATE="apptemplates/simplenodeservice-content/rollout.yml"
              if ! grep -q "stableService" "$TEMPLATE"; then
                echo "FAIL: Rollout must have stableService"
                exit 1
              fi
              if ! grep -q "canaryService" "$TEMPLATE"; then
                echo "FAIL: Rollout must have canaryService"
                exit 1
              fi
              if ! grep -q "argoproj-labs/gatewayAPI" "$TEMPLATE"; then
                echo "FAIL: Rollout must use Gateway API plugin"
                exit 1
              fi
              echo "PASS: Rollout template validated"

    - name: validate-helm-chart
      description: Helm chart must include envoy-gateway apps
      try:
        - script:
            timeout: 60s
            content: |
              #!/bin/bash
              set -e
              REPO_ROOT=$(git rev-parse --show-toplevel 2>/dev/null || echo "${CHAINSAW_REPO_ROOT:-/workspaces/x-change-platform-engineering-demo}")
              cd "$REPO_ROOT"
              helm lint gitops/platform-apps >/dev/null 2>&1
              OUTPUT=$(helm template platform gitops/platform-apps 2>&1)
              if ! echo "$OUTPUT" | grep -q "name: envoy-gateway"; then
                echo "FAIL: envoy-gateway application not found"
                exit 1
              fi
              if ! echo "$OUTPUT" | grep -q "name: envoy-gateway-config"; then
                echo "FAIL: envoy-gateway-config application not found"
                exit 1
              fi
              echo "PASS: Helm chart validated"

    # ==========================================================================
    # Runtime Validation Tests (requires cluster with Gateway API CRDs)
    # ==========================================================================
    - name: check-gateway-api-crds
      description: Gateway API CRDs must be installed
      try:
        - script:
            timeout: 30s
            content: |
              #!/bin/bash
              set -e
              if ! kubectl get crd gatewayclasses.gateway.networking.k8s.io >/dev/null 2>&1; then
                echo "SKIP: Gateway API CRDs not installed - skipping runtime tests"
                exit 0
              fi
              if ! kubectl get crd gateways.gateway.networking.k8s.io >/dev/null 2>&1; then
                echo "SKIP: Gateway API CRDs not installed - skipping runtime tests"
                exit 0
              fi
              if ! kubectl get crd httproutes.gateway.networking.k8s.io >/dev/null 2>&1; then
                echo "SKIP: Gateway API CRDs not installed - skipping runtime tests"
                exit 0
              fi
              echo "PASS: Gateway API CRDs present"

    - name: verify-gatewayclass
      description: GatewayClass must be accepted
      try:
        - script:
            timeout: 60s
            content: |
              #!/bin/bash
              set -e
              # Check if Gateway API CRDs exist
              if ! kubectl get crd gatewayclasses.gateway.networking.k8s.io >/dev/null 2>&1; then
                echo "SKIP: Gateway API CRDs not installed"
                exit 0
              fi
              # Check for accepted GatewayClass
              ACCEPTED=$(kubectl get gatewayclass -o jsonpath='{.items[?(@.status.conditions[?(@.type=="Accepted")].status=="True")].metadata.name}' 2>/dev/null || echo "")
              if [ -z "$ACCEPTED" ]; then
                echo "WARN: No accepted GatewayClass found"
                exit 0
              fi
              echo "PASS: GatewayClass '$ACCEPTED' is accepted"

    - name: verify-gateway
      description: Gateway must be programmed
      try:
        - script:
            timeout: 60s
            content: |
              #!/bin/bash
              set -e
              # Check if Gateway API CRDs exist
              if ! kubectl get crd gateways.gateway.networking.k8s.io >/dev/null 2>&1; then
                echo "SKIP: Gateway API CRDs not installed"
                exit 0
              fi
              # Check for platform-gateway in envoy-gateway-system
              if ! kubectl get gateway platform-gateway -n envoy-gateway-system >/dev/null 2>&1; then
                echo "WARN: platform-gateway not found in envoy-gateway-system"
                exit 0
              fi
              # Verify listener is accepted
              LISTENER_ACCEPTED=$(kubectl get gateway platform-gateway -n envoy-gateway-system -o jsonpath='{.status.listeners[0].conditions[?(@.type=="Accepted")].status}' 2>/dev/null || echo "")
              if [ "$LISTENER_ACCEPTED" != "True" ]; then
                echo "WARN: Gateway listener not accepted"
                exit 0
              fi
              echo "PASS: Gateway platform-gateway is configured"

    - name: test-httproute-routing
      description: HTTPRoute must route traffic correctly
      try:
        - script:
            timeout: 120s
            content: |
              #!/bin/bash
              set -e
              # Check if Gateway API CRDs exist
              if ! kubectl get crd httproutes.gateway.networking.k8s.io >/dev/null 2>&1; then
                echo "SKIP: Gateway API CRDs not installed"
                exit 0
              fi
              # Check if platform-gateway exists
              if ! kubectl get gateway platform-gateway -n envoy-gateway-system >/dev/null 2>&1; then
                echo "SKIP: platform-gateway not found"
                exit 0
              fi

              # Create test namespace and resources
              NAMESPACE="chainsaw-gateway-test-$(date +%s)"
              kubectl create namespace "$NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -

              # Deploy test app
              cat <<EOF | kubectl apply -f -
              apiVersion: v1
              kind: Service
              metadata:
                name: test-stable
                namespace: $NAMESPACE
              spec:
                ports:
                - port: 80
                  targetPort: 5678
                selector:
                  app: test
              ---
              apiVersion: v1
              kind: Service
              metadata:
                name: test-canary
                namespace: $NAMESPACE
              spec:
                ports:
                - port: 80
                  targetPort: 5678
                selector:
                  app: test
              ---
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: test
                namespace: $NAMESPACE
              spec:
                replicas: 1
                selector:
                  matchLabels:
                    app: test
                template:
                  metadata:
                    labels:
                      app: test
                  spec:
                    containers:
                    - name: echo
                      image: hashicorp/http-echo:0.2.3
                      args: ["-text=chainsaw-gateway-test-success"]
                      ports:
                      - containerPort: 5678
              ---
              apiVersion: gateway.networking.k8s.io/v1
              kind: HTTPRoute
              metadata:
                name: test-route
                namespace: $NAMESPACE
              spec:
                parentRefs:
                - name: platform-gateway
                  namespace: envoy-gateway-system
                rules:
                - matches:
                  - path:
                      type: PathPrefix
                      value: /chainsaw-test
                  filters:
                  - type: URLRewrite
                    urlRewrite:
                      path:
                        type: ReplacePrefixMatch
                        replacePrefixMatch: /
                  backendRefs:
                  - name: test-stable
                    port: 80
                    weight: 100
                  - name: test-canary
                    port: 80
                    weight: 0
              EOF

              # Wait for pod to be ready
              kubectl wait --for=condition=ready pod -l app=test -n "$NAMESPACE" --timeout=60s

              # Wait for HTTPRoute to be accepted
              sleep 5
              ROUTE_ACCEPTED=$(kubectl get httproute test-route -n "$NAMESPACE" -o jsonpath='{.status.parents[0].conditions[?(@.type=="Accepted")].status}' 2>/dev/null || echo "")
              if [ "$ROUTE_ACCEPTED" != "True" ]; then
                echo "FAIL: HTTPRoute not accepted"
                kubectl delete namespace "$NAMESPACE" --ignore-not-found
                exit 1
              fi

              # Get Gateway service name dynamically
              GW_SVC=$(kubectl get svc -n envoy-gateway-system -l gateway.envoyproxy.io/owning-gateway-name=platform-gateway -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || echo "")
              if [ -z "$GW_SVC" ]; then
                echo "WARN: Gateway service not found - testing via direct pod"
                kubectl delete namespace "$NAMESPACE" --ignore-not-found
                exit 0
              fi

              # Test routing via Gateway service
              RESPONSE=$(kubectl run curl-test-$$ --image=curlimages/curl --rm -i --restart=Never --timeout=30s -- \
                curl -s "http://${GW_SVC}.envoy-gateway-system.svc.cluster.local/chainsaw-test" 2>/dev/null || echo "")

              # Cleanup
              kubectl delete namespace "$NAMESPACE" --ignore-not-found

              if echo "$RESPONSE" | grep -q "chainsaw-gateway-test-success"; then
                echo "PASS: HTTPRoute routing verified"
              else
                echo "WARN: Could not verify routing (network policy or other restriction)"
                exit 0
              fi

    - name: validate-argo-rollouts-gateway-plugin
      description: Argo Rollouts Gateway API plugin must be configured
      try:
        - script:
            timeout: 30s
            content: |
              #!/bin/bash
              set -e
              # Check if Argo Rollouts namespace exists
              if ! kubectl get ns argo-rollouts >/dev/null 2>&1; then
                echo "SKIP: argo-rollouts namespace not found"
                exit 0
              fi
              # Check ConfigMap exists with Gateway API plugin
              PLUGIN=$(kubectl get configmap argo-rollouts-config -n argo-rollouts -o jsonpath='{.data.trafficRouterPlugins}' 2>/dev/null || echo "")
              if [ -z "$PLUGIN" ]; then
                echo "WARN: argo-rollouts-config ConfigMap not found or empty"
                exit 0
              fi
              if ! echo "$PLUGIN" | grep -q "argoproj-labs/gatewayAPI"; then
                echo "FAIL: Gateway API plugin not configured in argo-rollouts-config"
                exit 1
              fi
              echo "PASS: Argo Rollouts Gateway API plugin configured"

    - name: validate-gateway-api-rbac
      description: RBAC for HTTPRoute access must exist
      try:
        - script:
            timeout: 30s
            content: |
              #!/bin/bash
              set -e
              # Check ClusterRole exists
              if ! kubectl get clusterrole argo-rollouts-gateway-api >/dev/null 2>&1; then
                echo "WARN: argo-rollouts-gateway-api ClusterRole not found"
                exit 0
              fi
              # Check ClusterRoleBinding exists
              if ! kubectl get clusterrolebinding argo-rollouts-gateway-api >/dev/null 2>&1; then
                echo "WARN: argo-rollouts-gateway-api ClusterRoleBinding not found"
                exit 0
              fi
              # Verify RBAC has httproutes permission
              RULES=$(kubectl get clusterrole argo-rollouts-gateway-api -o jsonpath='{.rules[*].resources[*]}' 2>/dev/null || echo "")
              if ! echo "$RULES" | grep -q "httproutes"; then
                echo "FAIL: ClusterRole missing httproutes permission"
                exit 1
              fi
              echo "PASS: Gateway API RBAC configured correctly"
