# GitHub Codespaces environment overrides
#
# This file contains environment-specific values for Codespaces deployments.
# Only values that differ from values.yaml need to be specified here.

global:
  # Use main branch for Codespaces (production-like)
  targetRevision: "main"

applications:
  # Enable Keptn for Codespaces (lifecycle toolkit)
  keptn:
    enabled: true

  # Disable ingress-nginx (use Gateway API instead)
  ingress-nginx:
    enabled: false
