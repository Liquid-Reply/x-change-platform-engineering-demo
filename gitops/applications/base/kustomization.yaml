apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Base ArgoCD Applications for the platform
# These applications deploy the platform components via GitOps
# Use overlays to customize for specific environments (codespaces, minikube)

resources:
  - argoconfig.yml
  - argorollouts.yml
  - argoworkflows.yml
  - backstage.yml
  - cert-manager.yml
  - dynatrace.yml
  - ingress-nginx.yml
  - kubeaudit.yml
  - namespaces.yml
  - openfeature.yml
  - opentelemetry.yml

# Note: keptn.yml.disabled and cron-jobs.yml.BAK are intentionally excluded
