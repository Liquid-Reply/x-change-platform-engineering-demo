apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform
  namespace: argocd
  labels:
    dt.owner: "platform_team"
spec:
  source:
    path: "gitops/platform-apps"
    repoURL: "https://github.com/Liquid-Reply/x-change-platform-engineering-demo.git"
    targetRevision: feature/MOD-003
    helm:
      valueFiles:
        - values-kind.yaml
  destination:
    namespace: argocd
    server: 'https://kubernetes.default.svc'
  project: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 5s
        maxDuration: 3m0s
        factor: 2
