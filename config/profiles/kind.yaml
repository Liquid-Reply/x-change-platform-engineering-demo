# Kind Environment Profile
# Configuration for running the IDP platform on Kind (Kubernetes in Docker)

environment: kind

# Cluster configuration
cluster:
  name: idp
  config_file: .devcontainer/kind-cluster.yml
  wait_timeout: 5m

# Port configuration (mapped via kind-cluster.yml)
ports:
  argocd: 30100
  backstage: 30105
  demo_app: 80
  otel_grpc: 4317
  otel_http: 4318

# URL configuration
urls:
  base_domain: localhost
  # Kind uses Docker port forwarding, so localhost works directly

# Image preloading (faster deployments, offline capability)
images:
  preload: true
  list:
    - ghcr.io/katharinasick/backstage-playground:1.2.4
    - ghcr.io/dynatrace-oss/bizevent-pusher:v1.1.1
    - quay.io/argoproj/argocd:v2.12.2
    - ghcr.io/dexidp/dex:v2.38.0
    - redis:7.0.15-alpine

# Secrets: loaded from secrets/kind.env by bootstrap.sh

# Component toggles
# Set to false to disable components and save resources
components:
  argocd: true           # Required - GitOps engine
  backstage: true        # Required - Developer portal
  cert_manager: true     # Required - Certificate management
  ingress: true          # Required - Ingress controller
  opentelemetry: true    # Recommended - Tracing
  dynatrace: false       # Optional - Set to true if you have DT credentials
  keptn: false           # Optional - Lifecycle toolkit (resource heavy)
  openfeature: false     # Optional - Feature flags
  kubeaudit_cronjobs: false  # Optional - Security scanning

# Dynatrace configuration (only used if dynatrace component is enabled)
dynatrace:
  # Leave empty to skip Dynatrace integration
  # Set DT_* variables in secrets/kind.env
  skip_if_missing: true  # Don't fail if DT credentials missing
